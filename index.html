<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List App - Gourav Writes</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Instagram-like background gradient + readable card styles */
        body{
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial;
            margin: 40px;
            color: #222;
            min-height: 100vh;
            background: radial-gradient(circle at 30% 20%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
            background-attachment: fixed;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* subtle dark overlay to improve contrast */
        body::before{
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.12);
            pointer-events: none;
            z-index: 0;
        }

        .container{max-width:900px;margin:0 auto;position:relative;z-index:1}
        .todo-wrapper{
            background: rgba(255,255,255,0.92);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        a{color:#0366d6;text-decoration:none}

        /* Photo preview styles */
        .photo-section{margin:18px 0;padding:12px;border:1px dashed rgba(0,0,0,0.08);border-radius:8px}
        .photo-preview{display:block;max-width:240px;max-height:240px;margin-top:12px;border-radius:8px;object-fit:cover}
        .file-input{display:flex;gap:8px;align-items:center}
        .upload-btn{padding:8px 12px;background:#0366d6;color:#fff;border:none;border-radius:6px;cursor:pointer}
        .remove-btn{padding:8px 12px;background:#e55353;color:#fff;border:none;border-radius:6px;cursor:pointer}

        /* Make upload input less tall on mobile */
        @media (max-width:600px){
            body{margin:20px}
            .photo-preview{max-width:100%;height:auto}
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="todo-wrapper">
            <h1>✨ My Todo List</h1>
            <p class="subtitle">Stay organized and productive</p>
            
            <div class="input-section">
                <input 
                    type="text" 
                    id="todoInput" 
                    class="todo-input" 
                    placeholder="Add a new task..."
                    autocomplete="off"
                >
                <button id="addBtn" class="add-btn">Add Task</button>
            </div>

            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>

            <ul id="todoList" class="todo-list"></ul>
            
            <div class="stats">
                <span id="taskCount" class="stat">Tasks: 0</span>
                <button id="clearBtn" class="clear-btn">Clear Completed</button>
            </div>

            <!-- Photo upload section -->
            <section class="photo-section">
                <h2>Upload a Photo</h2>
                <div class="file-input">
                    <input type="file" id="photoInput" accept="image/*">
                    <button id="removePhoto" class="remove-btn">Remove</button>
                </div>
                <img id="photoPreview" class="photo-preview" alt="Photo preview" src="" style="display:none">
                <p style="margin-top:8px;color:#666;font-size:14px">Select an image to preview it locally. (Image is not uploaded anywhere.)</p>
            </section>

        </div>
    </div>

    <script>
    // Photo upload + preview logic
    (function(){
        const photoInput = document.getElementById('photoInput');
        const photoPreview = document.getElementById('photoPreview');
        const removeBtn = document.getElementById('removePhoto');

        photoInput.addEventListener('change', function(e){
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')){
                alert('Please select an image file.');
                photoInput.value = '';
                return;
            }
            const reader = new FileReader();
            reader.onload = function(ev){
                photoPreview.src = ev.target.result;
                photoPreview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        });

        removeBtn.addEventListener('click', function(e){
            e.preventDefault();
            photoInput.value = '';
            photoPreview.src = '';
            photoPreview.style.display = 'none';
        });
    })();
    </script>

    <script src="script.js"></script>
</body>
</html>
